services:
  redmine:
    image: redmine
    restart: always
    ports:
      - 3000:3000
    environment:
      REDMINE_DB_MYSQL: db
      REDMINE_DB_PASSWORD: example
      REDMINE_SECRET_KEY_BASE: supersecretkey
      TZ: Europe/Moscow
    entrypoint: >
      sh -c "
        bundle exec rake redmine:plugins:migrate RAILS_ENV=production || true &&
        exec /docker-entrypoint.sh rails server -b 0.0.0.0
      "
    volumes:
      - ./conf.d/database.yml:/usr/src/redmine/config/database.yml
      - ./themes:/usr/src/redmine/themes
      - ./plugins:/usr/src/redmine/plugins
      - ./redmine_files:/usr/src/redmine/files
    
  db:
    image: postgres:12.3
    environment:
      - POSTGRES_DB=redmine
      - POSTGRES_USER=redmine
      - POSTGRES_PASSWORD=redmine
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
